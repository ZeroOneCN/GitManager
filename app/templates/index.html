<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitManager · 本机 Git 管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='6' cy='6' r='3' fill='%232563eb'/%3E%3Ccircle cx='18' cy='18' r='3' fill='%232563eb'/%3E%3Cpath d='M6 9v3a3 3 0 0 0 3 3h6' stroke='%232563eb' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <circle cx="6" cy="6" r="2.6" fill="currentColor"></circle>
          <circle cx="18" cy="18" r="2.6" fill="currentColor"></circle>
          <path d="M6 8.6v2.9a2.5 2.5 0 0 0 2.5 2.5H15" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
        </svg>
      </span>
      <div class="brand-text">
        <h1>GitManager</h1>
        <p>本机 Git 仓库体检与安全操作</p>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="主导航">
      <button class="tab is-active" data-tab="dashboard" role="tab" aria-selected="true">仓库看板</button>
      <button class="tab" data-tab="audit" role="tab" aria-selected="false">操作审计</button>
    </nav>

    <div class="header-actions">
      <button class="btn btn-ghost" id="btn-refresh" title="读取所有仓库的最新本地状态">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        <span>刷新全部</span>
      </button>
      <button class="btn btn-primary" id="btn-add">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        <span>添加仓库</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <section id="view-dashboard" class="view">
      <div class="summary-strip" id="summary-strip"></div>
      <div class="repo-grid" id="repo-grid"></div>
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="52" height="52">
            <circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="3"></circle>
            <circle cx="48" cy="48" r="6" fill="none" stroke="currentColor" stroke-width="3"></circle>
            <path d="M16 22v10a6 6 0 0 0 6 6h14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
          </svg>
        </div>
        <h2>还没有添加任何仓库</h2>
        <p id="empty-hint">点击右上角「添加仓库」，在白名单目录中一次多选本地 Git 仓库。</p>
        <button class="btn btn-primary" id="btn-add-empty">添加第一个仓库</button>
      </div>
    </section>

    <section id="view-audit" class="view" hidden>
      <div class="panel audit-panel">
        <div class="panel-head">
          <div>
            <h2>操作审计</h2>
            <p class="panel-sub">记录所有实际执行的 git 命令；失败项标红。</p>
          </div>
          <div class="audit-filters">
            <label class="field">
              <span>仓库</span>
              <select id="audit-repo"><option value="">全部仓库</option></select>
            </label>
            <label class="field">
              <span>动作</span>
              <select id="audit-action"><option value="">全部动作</option></select>
            </label>
            <label class="check inline">
              <input type="checkbox" id="audit-failed">
              <span>只看失败</span>
            </label>
            <button class="btn btn-ghost" id="audit-refresh">刷新</button>
          </div>
        </div>
        <div class="audit-table-wrap">
          <table class="audit-table">
            <thead>
              <tr>
                <th class="col-time">时间</th>
                <th class="col-repo">仓库</th>
                <th class="col-action">动作</th>
                <th class="col-command">命令</th>
                <th class="col-code">退出码</th>
                <th class="col-duration">耗时</th>
                <th class="col-result">结果</th>
                <th class="col-summary">输出摘要</th>
              </tr>
            </thead>
            <tbody id="audit-body"></tbody>
          </table>
          <div class="audit-empty" id="audit-empty" hidden>暂无审计记录。</div>
        </div>
        <div class="audit-footer">
          <span id="audit-range" class="muted"></span>
          <div class="pager">
            <button class="btn btn-ghost" id="audit-prev">上一页</button>
            <button class="btn btn-ghost" id="audit-next">下一页</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="modal-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
